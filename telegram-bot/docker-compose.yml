# Запуск одной командой: docker compose up -d --build
# Логи: docker compose logs -f bot

services:
  bot:
    build: .
    container_name: crmino_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Персистентность SQLite между перезапусками контейнера
      - ./data:/app/data
      # Креды сервис-аккаунта Google (только чтение)
      - ./credentials:/app/credentials:ro
    # Для SQLite (MVP) внешние сервисы не нужны.
    # depends_on:
    #   - db

